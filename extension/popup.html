<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blip Control Center</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #131b2e;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent-goku: #f59e0b;
      --accent-reappear: #10b981;
      --success: #22c55e;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 320px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 22px;
      height: 22px;
      background: var(--primary);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 11px;
    }

    .title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
    }

    .status-pill {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .status-pill.off {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.2);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #334155;
      transition: 0.2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--success);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 10px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: white;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-snap {
      background: var(--primary);
    }

    .btn-goku {
      background: var(--accent-goku);
    }

    .btn-reappear {
      background: var(--accent-reappear);
      width: 100%;
      margin-bottom: 8px;
    }

    .btn-calib {
      background: #2563eb;
      width: 100%;
    }

    .shortcut-badge {
      font-size: 9px;
      background: rgba(0, 0, 0, 0.25);
      padding: 1px 4px;
      border-radius: 4px;
      margin-left: 4px;
    }

    .control-row {
      margin-top: 10px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type="range"] {
      width: 100%;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #64748b;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-badge">B</div>
      <div class="title">Blip Control</div>
    </div>
    <div id="status-pill" class="status-pill">Ready</div>
  </div>

  <div class="card">
    <div class="toggle-row">
      <span style="font-weight: 600;">Meeting Interception</span>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="section-title">Instant Triggers</div>
    <div class="btn-grid">
      <button id="btn-snap" class="btn-snap">Snap Dust</button>
      <button id="btn-goku" class="btn-goku">Goku Vanish</button>
    </div>
    <button id="btn-reappear" class="btn-reappear">
      Reappear Live <span class="shortcut-badge">Alt+Shift+S</span>
    </button>
    <button id="btn-calibrate" class="btn-calib">Calibrate Room Plate (3s)</button>
  </div>

  <div class="card">
    <div class="section-title">Gesture Sensitivity</div>
    <div class="control-row">
      <div class="control-label">
        <span>Snap Sensitivity</span>
        <span id="val-snap">75%</span>
      </div>
      <input type="range" id="range-snap" min="10" max="100" value="75">
    </div>

    <div class="control-row">
      <div class="control-label">
        <span>Audio Click Spike</span>
        <span id="val-audio">65%</span>
      </div>
      <input type="range" id="range-audio" min="10" max="100" value="65">
    </div>

    <div class="control-row">
      <div class="control-label">
        <span>Dust Duration</span>
        <span id="val-duration">1.5s</span>
      </div>
      <input type="range" id="range-duration" min="5" max="30" value="15">
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="check-automute" checked>
      <span>Auto-mute mic when vanished</span>
    </label>
  </div>

  <div class="footer">
    <span>Blip v1.0.0 Extension</span>
    <span>Zero Cloud Video</span>
  </div>

  <script type="module" src="dist/popup.js"></script>
</body>
</html>
