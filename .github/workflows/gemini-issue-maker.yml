name: Automated Gemini Codebase Issue Maker

on:
  schedule:
    # Runs every day at 4:00 AM IST (22:30 UTC of previous day)
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      target_area:
        description: 'Codebase target area to audit'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - security
          - guardrails
          - ai_vision
          - performance
      max_issues:
        description: 'Maximum new issues to create (capped at 5)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '5'
      dry_run:
        description: 'Dry run mode (preview findings in Job Summary without creating GitHub issues)'
        required: true
        default: false
        type: boolean
      force_engine:
        description: 'Force specific AI engine'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - groq

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  audit-and-create-issues:
    name: Codebase Audit & Issue Creation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Google GenAI SDK & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'google-genai>=2.30.1'

      - name: Run Codebase Issue Generator Agent
        env:
          ISSUE_MAKER_GEMINI_KEY: ${{ secrets.ISSUE_MAKER_GEMINI_KEY || secrets.GEMINI_API_KEY }}
          ISSUE_MAKER_GROQ_KEY: ${{ secrets.ISSUE_MAKER_GROQ_KEY || secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_AREA_INPUT: ${{ github.event.inputs.target_area || 'all' }}
          MAX_ISSUES_INPUT: ${{ github.event.inputs.max_issues || '2' }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_ENGINE_INPUT: ${{ github.event.inputs.force_engine || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          DRY_RUN_FLAG=""
          # Policy gate: scheduled runs must never create issues unattended.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$DRY_RUN_INPUT" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          python scripts/gemini_issue_generator.py \
            --target "$TARGET_AREA_INPUT" \
            --max-issues "$MAX_ISSUES_INPUT" \
            --force-engine "$FORCE_ENGINE_INPUT" \
            --output-summary issue_summary.md \
            $DRY_RUN_FLAG

      - name: Publish Action Step Summary
        if: always()
        run: |
          if [ -f issue_summary.md ]; then
            cat issue_summary.md >> $GITHUB_STEP_SUMMARY
          fi

