name: PR Auto-Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    name: Auto-Label Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Apply Path-Based Labels
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Apply Conventional Commit Title Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const title = pr.title || '';
            const labelsToAdd = new Set();

            const patterns = [
              { regex: /^feat(\([a-zA-Z0-9_\/-]+\))?:/i, label: 'enhancement' },
              { regex: /^fix(\([a-zA-Z0-9_\/-]+\))?:/i, label: 'bug' },
              { regex: /^perf(\([a-zA-Z0-9_\/-]+\))?:/i, label: 'performance' },
              { regex: /^docs(\([a-zA-Z0-9_\/-]+\))?:/i, label: 'documentation' },
              { regex: /^(refactor|chore|ci|build|test|style)(\([a-zA-Z0-9_\/-]+\))?:/i, label: 'maintenance' },
            ];

            for (const { regex, label } of patterns) {
              if (regex.test(title)) {
                labelsToAdd.add(label);
              }
            }

            // Check for specific sub-components in title scopes (e.g. feat(camera): ...)
            if (/^[a-z]+(\([a-zA-Z0-9_\/-]*camera[a-zA-Z0-9_\/-]*\))?:/i.test(title)) {
              labelsToAdd.add('component:camera');
            }
            if (/^[a-z]+(\([a-zA-Z0-9_\/-]*gesture[a-zA-Z0-9_\/-]*\))?:/i.test(title)) {
              labelsToAdd.add('component:gestures');
            }
            if (/^[a-z]+(\([a-zA-Z0-9_\/-]*effect[a-zA-Z0-9_\/-]*\))?:/i.test(title)) {
              labelsToAdd.add('component:effects');
            }
            if (/^[a-z]+(\([a-zA-Z0-9_\/-]*ui[a-zA-Z0-9_\/-]*\))?:/i.test(title)) {
              labelsToAdd.add('component:ui');
            }
            if (/^[a-z]+(\([a-zA-Z0-9_\/-]*web[a-zA-Z0-9_\/-]*\))?:/i.test(title)) {
              labelsToAdd.add('area:web');
            }

            if (labelsToAdd.size > 0) {
              console.log(`Adding conventional labels: ${Array.from(labelsToAdd).join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labelsToAdd)
              });
            }
