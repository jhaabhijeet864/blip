name: Gemini Architectural PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  architectural-review:
    name: High-Level AI Review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Google GenAI SDK
        run: |
          python -m pip install --upgrade pip
          pip install google-genai>=2.30.1

      - name: Generate Architectural Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/gemini_pr_reviewer.py --output pr_review.md

      - name: Publish or Update Sticky PR Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewBody = fs.readFileSync('pr_review.md', 'utf8');
            const stickyMarker = '<!-- BLIP-GEMINI-ARCHITECTURAL-REVIEW -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(stickyMarker));

            if (existingComment) {
              console.log(`Updating existing sticky review comment ID: ${existingComment.id}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: reviewBody,
              });
            } else {
              console.log(`Creating new sticky review comment for PR #${context.payload.pull_request.number}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: reviewBody,
              });
            }

      - name: Record Action Step Summary
        run: |
          cat pr_review.md >> $GITHUB_STEP_SUMMARY
