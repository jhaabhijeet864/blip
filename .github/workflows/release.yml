name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.2.0 - leave blank to extract from pyproject.toml)'
        required: false
        default: ''
      custom_notes:
        description: 'Optional custom release highlights or announcement (markdown format)'
        type: string
        required: false
        default: ''
      is_draft:
        description: 'Publish as a Draft release'
        type: boolean
        required: false
        default: false
      is_prerelease:
        description: 'Publish as a Pre-release'
        type: boolean
        required: false
        default: false
      dry_run:
        description: 'Dry run (verify build and checksums without publishing to GitHub)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Standalone Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Compile Windows Executable via PyInstaller
        run: |
          python scripts/build_exe.py

      - name: Package Windows Distribution Archive
        run: |
          Compress-Archive -Path dist\Blip\* -DestinationPath dist\Blip-Windows-x64.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist\Blip-Windows-x64.zip).Hash.ToLower()
          "$hash  Blip-Windows-x64.zip" | Out-File -Encoding ascii dist\checksum_windows.txt

      - name: Upload Windows Asset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: |
            dist/Blip-Windows-x64.zip
            dist/checksum_windows.txt

  build-python-packages:
    name: Build Python Wheels & Source Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Build Tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Wheel and Source Tarball
        run: |
          python -m build
          cd dist
          sha256sum * > checksum_python.txt

      - name: Upload Python Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-release-assets
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/checksum_python.txt

  build-tauri-desktop:
    name: Build Tauri v2 Desktop Standalone (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build UI Assets
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Build Standalone Rust Binary
        run: |
          cargo build --release -p blip-desktop

      - name: Stage Desktop Release Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\blip-desktop.exe dist\Blip-Studio.exe -Force
          $hash = (Get-FileHash -Algorithm SHA256 dist\Blip-Studio.exe).Hash.ToLower()
          "$hash  Blip-Studio.exe" | Out-File -Encoding ascii dist\checksum_tauri.txt

      - name: Upload Tauri Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-release-assets
          path: |
            dist/Blip-Studio.exe
            dist/checksum_tauri.txt

  build-extension:
    name: Package Chrome Extension (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'extension/package-lock.json'

      - name: Install and Build Extension
        working-directory: extension
        run: |
          npm ci
          npm run build

      - name: Package Extension Archive
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/package_extension.ps1
          $hash = (Get-FileHash -Algorithm SHA256 dist\blip-extension-v1.0.0.zip).Hash.ToLower()
          "$hash  blip-extension-v1.0.0.zip" | Out-File -Encoding ascii dist\checksum_extension.txt

      - name: Upload Extension Asset Artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-assets
          path: |
            dist/blip-extension-v1.0.0.zip
            dist/checksum_extension.txt

  publish-release:
    name: Publish GitHub Release
    needs: [ build-windows-exe, build-python-packages, build-tauri-desktop, build-extension ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f2)
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Selected Release Tag: $TAG"

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: release_assets

      - name: Download Tauri Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: tauri-release-assets
          path: release_assets

      - name: Download Python Artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-release-assets
          path: release_assets

      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-release-assets
          path: release_assets

      - name: Assemble Global Checksum File
        run: |
          cd release_assets
          cat checksum_windows.txt checksum_tauri.txt checksum_python.txt checksum_extension.txt > checksums.sha256
          rm -f checksum_windows.txt checksum_tauri.txt checksum_python.txt checksum_extension.txt
          echo "### Release Checksums (SHA-256)"
          cat checksums.sha256

      - name: Generate Detailed Release Notes
        env:
          CUSTOM_NOTES: ${{ inputs.custom_notes || '' }}
        run: |
          python scripts/generate_release_notes.py \
            --tag "${{ steps.get_tag.outputs.tag }}" \
            --assets-dir release_assets \
            --output release_assets/RELEASE_NOTES.md
          echo "### Generated Release Notes:"
          cat release_assets/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: ${{ !(inputs.dry_run) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Blip ${{ steps.get_tag.outputs.tag }}
          draft: ${{ inputs.is_draft || false }}
          prerelease: ${{ inputs.is_prerelease || false }}
          body_path: release_assets/RELEASE_NOTES.md
          append_body: true
          generate_release_notes: true
          files: |
            release_assets/Blip-Studio.exe
            release_assets/Blip-Windows-x64.zip
            release_assets/blip-extension-v1.0.0.zip
            release_assets/*.whl
            release_assets/*.tar.gz
            release_assets/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Step Summary
        run: |
          cat release_assets/RELEASE_NOTES.md >> $GITHUB_STEP_SUMMARY
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY

          ---
          ### ⚙️ Release Execution Summary
          | Field | Value |
          |---|---|
          | **Tag** | `${{ steps.get_tag.outputs.tag }}` |
          | **Dry Run** | `${{ inputs.dry_run || false }}` |
          | **Draft Mode** | `${{ inputs.is_draft || false }}` |
          | **Prerelease** | `${{ inputs.is_prerelease || false }}` |
          | **Configuration File** | `.github/release.yml` |
          | **Notes Generator** | `scripts/generate_release_notes.py` |
          EOF
