# Configuration for actions/labeler v5
# Automatically labels pull requests based on modified file paths

area:extension:
  - changed-files:
    - any-glob-to-any-file:
      - 'extension/**'

area:web:
  - changed-files:
    - any-glob-to-any-file:
      - 'web/**'

area:desktop-ui:
  - changed-files:
    - any-glob-to-any-file:
      - 'ui/**'

area:rust:
  - changed-files:
    - any-glob-to-any-file:
      - 'crates/**'
      - 'Cargo.*'

area:python:
  - changed-files:
    - any-glob-to-any-file:
      - 'blip/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - 'requirements*.txt'

area:ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

area:docs:
  - changed-files:
    - any-glob-to-any-file:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - 'SECURITY.md'

component:camera:
  - changed-files:
    - any-glob-to-any-file:
      - 'blip/core/devices*'
      - 'crates/blip-core/src/capture*'
      - 'crates/blip-core/src/vcam*'
      - 'crates/blip-core/src/device*'

component:webrtc:
  - changed-files:
    - any-glob-to-any-file:
      - 'extension/src/stream-interceptor.ts'
      - 'extension/src/injected.ts'

component:gestures:
  - changed-files:
    - any-glob-to-any-file:
      - 'blip/gestures/**'
      - 'crates/blip-core/src/gestures*'
      - 'extension/src/gestures/**'

component:effects:
  - changed-files:
    - any-glob-to-any-file:
      - 'blip/effects/**'
      - 'crates/blip-core/src/effects/**'
      - 'extension/src/effects/**'

component:ui:
  - changed-files:
    - any-glob-to-any-file:
      - 'blip/ui/**'
      - 'ui/**'
      - 'extension/popup.html'
      - 'extension/src/popup.ts'
