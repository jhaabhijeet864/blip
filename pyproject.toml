[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blip"
version = "0.1.0"
description = "A viral gesture-triggered virtual camera for Google Meet, Zoom, and Teams. Snap to dissolve like Thanos or tap to vanish like Goku."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Abhijeet Jha", email = "jhaabhijeet864@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "virtual-camera",
    "google-meet",
    "zoom",
    "mediapipe",
    "opencv",
    "computer-vision",
    "hand-gestures",
    "thanos-snap",
    "video-effects"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0,<=0.10.20",
    "pyvirtualcam>=0.11.0",
    "customtkinter>=5.2.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pynput>=1.7.6",
    "pygrabber>=0.2; platform_system == 'Windows'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
    "build>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/jhaabhijeet864/blip"
Repository = "https://github.com/jhaabhijeet864/blip.git"
Issues = "https://github.com/jhaabhijeet864/blip/issues"

[project.scripts]
blip = "blip.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blip*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
