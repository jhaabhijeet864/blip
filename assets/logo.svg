<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="blipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="#09090b" />
  <!-- Disappearing particles / dust burst -->
  <circle cx="140" cy="180" r="14" fill="#60a5fa" opacity="0.6" />
  <circle cx="180" cy="140" r="10" fill="#a78bfa" opacity="0.8" />
  <circle cx="360" cy="160" r="16" fill="#f472b6" opacity="0.7" />
  <circle cx="380" cy="220" r="8" fill="#60a5fa" opacity="0.5" />
  <circle cx="340" cy="360" r="12" fill="#c084fc" opacity="0.6" />
  <!-- Central Lightning / Energy Bolt -->
  <path d="M280 64L144 288h96l-48 160 176-224h-96z" fill="url(#blipGrad)" filter="url(#glow)" />
</svg>
