[package]
name = "blip-desktop"
version = "0.2.0"
edition = "2021"
authors = ["Abhijeet Jha <jhaabhijeet864@gmail.com>"]
description = "Lightweight high-performance Tauri v2 desktop application for Blip."
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
parking_lot = "0.13"
blip-core = { path = "../blip-core" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

